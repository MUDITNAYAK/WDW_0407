<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel Room Booking Form</title>
    
</body>
</html>
    <body> 
        <h1 align="center">Hotel Room Booking Form</h1>
        <form action="#" method="post">
            <!-- ACTION IS FOR THE SITE WHERE THE DATA WILL GO-->
             <!-- METHOD IS OF TWO TYPES :- GET AND POST -->
            
             <div><label for="fullname">Full Name:</label>
            <input id="fullname" type="text" name="fullname" required> 
            <!--id and for are connected, type is to define the type of data that will be entered in the input box-->
            <!-- name is attribute that will send the input data to the server and required means that some data must be entered-->
            </div>
            <br>

            <div>
            <label for="email">Email:</label>
            <input id="email" type="email" name="email" required>
            <!-- type email ensures that the user must input a email-->
            </div>
            <br>

            <div>
                <label for="phone">Phone:</label>
                <input id="phone" type="tel" name="phone" required>
                <!-- type telephone makes sure that user inputs a telephone number-->
            </div>
            <br>

            <div>
                <label for="password">Phone:</label>
                <input id="password" type="password" name="password" required>
                <!-- type password makes sure that when user input some data that must be hidden in the form of black dots-->
            </div>
            <br>
            
        </form>

        
    </body>

</html>
